<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IP Search</title>
    <link rel ="stylesheet" href="webpage.css">
</head>
<body>
    <nav class = "navbar">
        <div class = "controls"> <input type="text" id="country_in" placeholder="ex:USA, CAN, MEX...">
            <button id="search-btn" class="primary">Start Search</button>
            <button id="clear-btn" class="secondary">Clear Input</button>
            <button id = "info-btn" class = "secondary">Info on Valid Countries</button>
        </div>
    </nav>
    <div class = "visualization">
        <div class="searchPanel trie-panel"> <div class="label">Trie Search</div> 
            <div class = "canvas">
                <div class = "stats">
                    <p>Time: <span id="trie-timer">0.0000</span> seconds</p> <div class = "progress">
                        <div class = "progress-bar" id="trie-progress"></div></div>
                    <p class = "processed_text">IP's Processed: <span id = "trie-count">0</span></p>
                </div>
            </div>
        </div>
        <div class="searchPanel hash-panel"> <div class="label">Hash Table Search</div> 
            <div class = "canvas">
                <div class = "stats">
                    <p>Time: <span id="hash-timer">0.0000</span> seconds</p> <div class = "progress">
                        <div class = "progress-bar" id="hash-progress"></div></div>
                    <p class = "processed_text">IP's Processed: <span id = "hash-count">0</span></p>
                </div>
            </div>
        </div>
    </div>
    <div id = "country" class = "scrollable_country">
        <div class = "country_content">
            <div class = "country_header">
                <h2>Valid Countries</h2>
                <span class = "close_country">&times;</span></div>
            <div class = "country_body">
                <table>
                    <thead>
                        <tr>
                            <th> Abbreviation</th>
                            <th> Country Name</th>
                        </tr>
                    </thead>
                    <tbody id = "country-table-body">
                    </tbody>
                </table>
            </div>
    <script src="webpage.js"></script>
</body>
</html>
